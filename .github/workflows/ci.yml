# Intégration continue — AJASDK
#
# La recherche de secrets tourne sur les neuf dépôts : c'est elle qui attrape
# le scénario le plus probable, une clé poussée par mégarde puis trouvée par
# un scanner automatique. Voir SECURITY.html §10.
name: CI

on:
  push:
    # Les branches de travail aussi : une CI qui ne tourne que sur les
    # branches d'intégration arrive toujours trop tard pour être utile.
    branches: [main, dev, v1, v2, 'v1-*', 'v2-*']
  pull_request:

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # L'historique entier : une clé retirée du dernier commit est
          # toujours dans l'historique, donc toujours volée.
          fetch-depth: 0
      - name: Installer gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
      - name: Analyser l'historique
        # --redact : le journal de la CI ne doit jamais imprimer ce qu'il trouve.
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose
  sdk:
    name: SDK PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl
      - name: composer.json valide
        run: composer validate --strict --no-check-lock
      - name: Syntaxe de chaque fichier
        run: find src examples -name '*.php' -print0 | xargs -0 -n1 php -l
  api:
    # Le SDK — ou l'application — contre une vraie API AJA : celle de la même
    # branche d'AJABACKEND, sur un Postgres vierge. Les autres jobs vérifient
    # que le code est valide ; celui-ci, qu'il parle correctement à l'API.
    name: Contre une vraie API AJA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aja
          POSTGRES_PASSWORD: aja
          POSTGRES_DB: aja
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aja"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: La clé de lecture d'AJABACKEND est posée
        # AJABACKEND est privé : le jeton de ce dépôt ne peut pas le lire. Une
        # clé de déploiement en lecture seule, rangée dans ce secret, le peut.
        env:
          KEY: ${{ secrets.AJABACKEND_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Le secret AJABACKEND_DEPLOY_KEY manque : voir AJADOCS, V2.html §21."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          path: self
      - uses: actions/checkout@v4
        with:
          repository: NdeyeFatou1998/AJABACKEND
          ssh-key: ${{ secrets.AJABACKEND_DEPLOY_KEY }}
          path: backend
      - name: Le backend de la même branche, sinon main
        working-directory: backend
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git fetch --depth 1 origin "refs/heads/$BRANCH" 2>/dev/null; then
            git checkout --quiet FETCH_HEAD
            echo "AJABACKEND $BRANCH @ $(git rev-parse --short HEAD)"
          else
            echo "::notice::AJABACKEND n'a pas de branche $BRANCH : main @ $(git rev-parse --short HEAD)"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: L'API, sur une base vierge
        working-directory: backend
        run: |
          npm ci
          cp .env.example .env
          npx prisma migrate deploy
          npm run build
          node --env-file=.env dist/index.js > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health > /dev/null && exit 0
            sleep 1
          done
          cat api.log
          exit 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl
      - name: Scénario de conformité
        working-directory: self
        env:
          AJA_API: http://localhost:8080
        run: php conformance/run.php
      - name: Journal de l'API
        if: failure()
        run: cat backend/api.log
